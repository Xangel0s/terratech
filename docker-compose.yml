services:
  postgres:
    image: postgres:16-alpine
    container_name: terratech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: terratech_db
      POSTGRES_USER: terratech_admin
      POSTGRES_PASSWORD: TerratechSecureMiningPass2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./terratech-api/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terratech_admin -d terratech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./terratech-api
      dockerfile: Dockerfile
    container_name: terratech-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      DATABASE_URL: "postgres://terratech_admin:TerratechSecureMiningPass2026!@postgres:5432/terratech_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terratech-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://api:8080"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: terratech-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
